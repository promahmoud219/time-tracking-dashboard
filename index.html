<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles/main.css">
  
  <!-- Rubic  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Time tracking dashboard</title>


</head>
<body>
 
  <main>

    <article class="time-tracking-dashboard">

      <article class="profile">

        <div class="profile__info">

          <img src="./images/image-jeremy.png" alt="profile image of Jeremy" class="profile__avatar">

          <div class="profile__title">
            <p class="profile__label">Report for</p>
            <h1 class="profile__name">Jeremy Robson</h1>
          </div>

        </div>

        <nav class="filter-time" role="group" aria-label="Time Period">
          
          <button 
            class="filter-time__button"
            type="button"
            data-period="daily"
            >
            Daily
          </button>
          
          <button 
            class="button-weekly filter-time__button filter-time__button--active"
            aria-pressed="true"
            type="button"
            data-period="weekly"
            >
            Weekly
          </button>
          
          <button 
            class="button-monthly filter-time__button"
            type="button"
            data-period="monthly"
          >
            Monthly
          </button>

        </nav>

      </article>

      <article class="activity-card">
        
        <header class="activity-card__header">
          <img src="./images/icon-play.svg" alt="" class="activity-card__icon">
        </header>
        
        <div class="activity-card__body">
          <div class="activity-card__title-and-options">
            <h2 class="activity-card__title">work</h2>
            <button class="activity-card__options" aria-label="activity card options">
              <img src="./images/icon-ellipsis.svg" alt="">
            </button>
          </div>

          <div class="activity-card__time">
            <p class="activity-card__current-time">4hrs</p>
            <p class="activity-card__previous-time">Last Week - 5hrs</p>
          </div>
        </div>
